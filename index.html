<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルーレット</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f1f5f9;color:#18263a;margin:0}.app{max-width:520px;margin:auto;padding:15px}.tabs{display:flex;gap:5px;background:#dfe8f4;padding:4px;border-radius:14px}button{font:inherit;font-weight:bold;cursor:pointer;padding:12px;border:0;border-radius:11px}button:disabled{opacity:.5}.tabs button{flex:1;background:transparent}.on,.primary{background:#2375e8!important;color:white}.panel{background:white;border-radius:18px;padding:18px;margin-top:14px}.hidden{display:none}.center{text-align:center}.sub{font-size:12px;color:#64748b}.result{background:#edf2f8;text-align:center;padding:15px;border-radius:12px;font-size:22px;font-weight:bold;margin:15px 0}.primary{width:100%}.secondary{width:100%;margin-top:9px;border:1px solid #cbd5e1;background:white}.wheelbox{width:min(100%,330px);aspect-ratio:1;position:relative;margin:25px auto}.wheel{position:absolute;inset:5px;border:7px solid white;border-radius:50%;box-shadow:0 0 0 2px #cbd5e1;background:conic-gradient(from -36deg,#91d8f1 0 72deg,#ffda91 72deg 144deg,#b9e8ac 144deg 216deg,#d8c2f3 216deg 288deg,#ffb8bc 288deg 360deg)}.digit{position:absolute;top:50%;left:50%;font-size:38px;font-weight:900;color:#142338;text-shadow:2px 2px white,-2px -2px white,-2px 2px white,2px -2px white}.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border:3px solid #8193a3;border-radius:50%;background:linear-gradient(#fff,#cdd7e1)}.pointer{position:absolute;z-index:2;top:-11px;left:50%;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #263446}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.counts button{background:#eef2f7;border:1px solid #cbd5e1}.counts .on{background:#2375e8;color:white}.car{position:relative;width:min(100%,330px);margin:16px auto;padding:25px;border:5px solid #8aa99a;border-radius:44% 44% 24% 24% / 15% 15% 9% 9%;background:linear-gradient(90deg,#a9c8b6 0%,#d1dfd6 9%,#35454b 13%,#263238 87%,#d1dfd6 91%,#a9c8b6 100%)}.glass{height:35px;border-radius:60% 60% 15% 15%;background:linear-gradient(145deg,#aac7cd,#364b54 65%,#1c2b31);margin-bottom:12px}.mirror{position:absolute;top:76px;width:20px;height:29px;background:#91ac9e;border:3px solid #536b60;border-radius:8px}.l{left:-21px}.r{right:-21px}.seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 9px}.seat{min-height:82px;border:3px solid #aaa092;border-radius:17px;background:linear-gradient(#e9e3d8,#c8bfaf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.seat small{font-size:11px;font-weight:bold}.seat strong{font-size:22px}.seat.filled{background:linear-gradient(#b8dcff,#71b4f4);border-color:#2375e8}.seat.driver{background:linear-gradient(#899397,#59656a);color:white}.tail{text-align:center;color:white;font-weight:bold;margin-top:15px}.light{background:#ed6363}.muted{color:#64748b}
</style></head>
<body><main class="app"><nav class="tabs"><button class="on" id="tn">数字ルーレット</button><button id="ts">シエンタ座席</button></nav>
<section class="panel" id="pn"><h3 class="center">1〜5からランダムに1つ選択</h3><div class="wheelbox"><div class="pointer"></div><div class="wheel" id="wheel"><div class="hub"></div></div></div><div class="result" id="nr">準備完了</div><p class="center sub">矢印が指した数字が当選です</p><button class="primary" id="spin">ルーレットを回す</button></section>
<section class="panel hidden" id="ps"><h3 class="center">シエンタ 6人乗り・座席抽選</h3><p class="center sub">運転手以外の1〜4人を一括で配置します</p><b>抽選する人数</b><div class="counts" id="counts"><button data-n="1">1人</button><button data-n="2">2人</button><button data-n="3">3人</button><button data-n="4" class="on">4人</button></div><p class="center sub">↑ 車両前方</p><div class="car"><div class="mirror l"></div><div class="mirror r"></div><div class="glass"></div><div class="seatgrid"><div class="seat" data-s="0"><small>助手席</small><strong>—</strong></div><div class="seat driver"><small>運転席</small><strong>◉</strong><small>固定</small></div><div class="seat" data-s="1"><small>2列目・左</small><strong>—</strong></div><div class="seat" data-s="2"><small>2列目・右</small><strong>—</strong></div><div class="seat" data-s="3"><small>3列目・左</small><strong>—</strong></div><div class="seat" data-s="4"><small>3列目・右</small><strong>—</strong></div></div><div class="tail">SIENTA</div></div><div class="result" id="sr">4人の座席を抽選できます</div><button class="primary" id="draw">一括抽選する</button><button class="secondary" id="reset">リセット</button><p class="center sub">助手席には必ず1人を配置します。</p></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);function tab(s){$('pn').classList.toggle('hidden',s);$('ps').classList.toggle('hidden',!s);$('tn').classList.toggle('on',!s);$('ts').classList.toggle('on',s)}$('tn').onclick=()=>tab(false);$('ts').onclick=()=>tab(true);for(let i=0;i<5;i++){let a=i*72*Math.PI/180,d=document.createElement('span');d.className='digit';d.textContent=i+1;d.style.left=50+33*Math.sin(a)+'%';d.style.top=50-33*Math.cos(a)+'%';d.style.transform='translate(-50%,-50%) rotate('+i*72+'deg)';$('wheel').append(d)}let angle=0,busy=false;$('spin').onclick=()=>{if(busy)return;busy=true;$('spin').disabled=true;$('nr').textContent='回転中…';let c=rand(5)+1,t=(360-(c-1)*72)%360,cur=((angle%360)+360)%360;angle+=1800+(t-cur+360)%360;$('wheel').style.transition='transform 3.5s cubic-bezier(.12,.72,.13,1)';$('wheel').style.transform='rotate('+angle+'deg)';setTimeout(()=>{$('nr').textContent='結果：'+c;$('spin').disabled=false;busy=false},3600)};let n=4,running=false,timer=null;const seats=[...document.querySelectorAll('[data-s]')],counts=[...document.querySelectorAll('[data-n]')];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function allocation(){let p=[0,...shuffle([1,2,3,4]).slice(0,n-1)],people=shuffle(Array.from({length:n},(_,i)=>i+1));return p.map((x,i)=>[x,people[i]])}function clear(){seats.forEach(s=>{s.classList.remove('filled');s.querySelector('strong').textContent='—'})}function render(a){clear();a.forEach(([p,i])=>{seats[p].classList.add('filled');seats[p].querySelector('strong').textContent=i+'人目'})}counts.forEach(b=>b.onclick=()=>{if(running)return;n=Number(b.dataset.n);counts.forEach(x=>x.classList.toggle('on',x===b));clear();$('sr').textContent=n+'人の座席を抽選できます';$('draw').textContent='一括抽選する'});$('draw').onclick=()=>{if(running)return;running=true;$('draw').disabled=true;$('draw').textContent='抽選中…';$('sr').textContent='座席をシャッフル中…';let final=allocation(),tick=0;timer=setInterval(()=>{render(allocation());if(++tick>=22){clearInterval(timer);timer=null;render(final);running=false;$('draw').disabled=false;$('draw').textContent='もう一度抽選する';$('sr').textContent=n+'人の座席が決定しました！'}},95)};$('reset').onclick=()=>{if(timer)clearInterval(timer);timer=null;running=false;$('draw').disabled=false;$('draw').textContent='一括抽選する';clear();$('sr').textContent=n+'人の座席を抽選できます'}})();
</script></body></html>
